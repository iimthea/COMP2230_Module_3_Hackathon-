<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do List</title>
    </head>
    <body>
        <header>
            <h1 id="to-do">To-Do List</h1>
            </header>
            <main>
			          <section id="Morning">
                    <!-- Morning Information will be dynamically added here -->
                </section>
                <section id="Afternoon">
				            <ul id="afternoon-list"></ul>
				            <textarea type="text" id="task" name="task" cols="40" placeholder="Enter your task"></textarea>
				            <!-- Afternoon Information will be dynamically added here -->
			          </section>
                <section id="Night"> 
                    <!-- Night Information will be dynamically added here -->
                </section>
                <button id="Clear">Clear</button> 
            </main>
      <script src="script.js"></script>
    </body>
</html>
